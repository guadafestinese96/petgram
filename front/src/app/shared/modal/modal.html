@if (visible) {
  <div class="modal-fondo" (click)="clickFondo()">
    <div
      class="modal-caja modal-{{ tipo }}"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="titulo"
      (click)="$event.stopPropagation()"
    >
      <fa-icon [icon]="iconos[tipo]" class="modal-icono"></fa-icon>
      <h3 class="modal-titulo">{{ titulo }}</h3>
      <p class="modal-mensaje">{{ mensaje }}</p>

      <div class="modal-botones">
        @if (textoCancelar) {
          <button type="button" class="modal-boton modal-boton-secundario" (click)="cancelar.emit()">
            {{ textoCancelar }}
          </button>
        }
        <button
          type="button"
          class="modal-boton"
          [class.modal-boton-peligro]="peligro"
          (click)="cerrar.emit()"
        >
          {{ textoBoton }}
        </button>
      </div>
    </div>
  </div>
}
