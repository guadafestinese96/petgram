<nav class="navbar">
    <div class="logo">
        <img src="LOGO-PETGRAM-REDONDO.png" alt="logo" class="logo-img">
    </div>

    <div class="nav-centro">
        <button type="button" class="boton-nav" (click)="redirigirPublicaciones()" aria-label="Ir a publicaciones" title="Publicaciones">
            <fa-icon [icon]="faCamera" class="camara-img"></fa-icon>
        </button>

        <!-- Solo lo ven los administradores (directiva propia) -->
        <button *appSoloAdmin type="button" class="boton-nav" (click)="redirigirDashboard()" aria-label="Ir al dashboard" title="Dashboard">
            <fa-icon [icon]="faChartPie" class="camara-img"></fa-icon>
        </button>
    </div>

    <button type="button" class="boton-nav" (click)="redirigirSegunSesion()" aria-label="Ir a mi perfil" title="Mi perfil">
        @if (imagenUrl) {
            <img [src]="imagenUrl" appImagenRespaldo alt="Mi foto de perfil" class="usuario-foto">
        } @else {
            <fa-icon [icon]="faUser" class="usuario-img"></fa-icon>
        }
    </button>
</nav>
